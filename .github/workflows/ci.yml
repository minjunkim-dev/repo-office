# Pin every action to a full commit SHA. Dependabot (github-actions) keeps the pins current.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Other runs get their own group
# (run_id), so a newer run never cancels or replaces a pending run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # This job name is the required check context in repository-settings.json.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGENTS.md promises Python 3.9 or newer, and macOS ships 3.9 as /usr/bin/python3: test on the oldest.
      # One job keeps the required check named ci (a version matrix would rename it).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      # AGENTS.md: check is N/A (no linter).
      - name: test
        run: python3 -m unittest discover -p 'test_*.py'
