<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>office 상태판</title>
<style>
:root { --bg: #1b1d2a; --line: #3a3e55; --mute: #9aa0b8; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: #eef0f7; font: 14px/1.5 -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif;
       display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); }
body.solo { grid-template-columns: minmax(0, 1fr); }
section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.office { border-right: 1px solid var(--line); }
.office p { margin: 0; padding: 8px 14px; color: var(--mute); font-size: 12px; border-top: 1px solid var(--line); }
iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
@media (max-width: 900px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto; height: auto; }
  .office { border-right: 0; border-bottom: 1px solid var(--line); }
  .tasks iframe { height: 100vh; }
}
</style>
</head>
<body>
<!-- One screen. Left: the Pixel Agents office (live, never reloaded, so its animation keeps going).
     Right: board-tasks.html, the pipeline's stages and cards, which reloads itself every 5 seconds. -->
<section class="office" id="office">
  <iframe title="Pixel Agents 사무실" id="pixel"></iframe>
  <p>도트 사무실: Pixel Agents(<span id="where"></span>). 비어 있으면 README의 「도트 사무실」대로 띄운다.</p>
</section>
<section class="tasks"><iframe title="단계와 과제" src="board-tasks.html"></iframe></section>
<script>
"use strict";
const pixel = "/*PIXEL*/";  // engine.py board writes it only as a local http address without a query, or ""
if (pixel) {
  document.getElementById("pixel").src = pixel;
  document.getElementById("where").textContent = pixel;
} else {
  document.getElementById("office").remove();
  document.body.classList.add("solo");
}
</script>
</body>
</html>
